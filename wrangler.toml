name = "lbg"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-25"

# Local dev: `bun run dev` → `wrangler pages dev -- vite`
#   Vite serves the UI (with HMR); pages dev adds the /api/* Functions.
# Deploy: `bun install && bun run build && wrangler pages deploy`
#   (pages_build_output_dir above tells wrangler to upload dist/)

[observability]
enabled = true
